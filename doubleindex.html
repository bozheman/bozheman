<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOZHEMAN ≡ ИЛЛЮЗИЯ</title>
  <link rel="icon" type="image/png" href="assets/images/gg.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/doubleindex.css">
  <link rel="stylesheet" href="css/neon.css">
</head>
<body>

  <canvas id="matrix-canvas"></canvas>

  <main class="terminal-window" id="terminal">
    <h1 data-text="ILLUSION" data-i18n="illusion_title">ILLUSION</h1>
    <div id="fragment-display">
        <p data-i18n="illusion_click">[CLICK TO BEHOLD]</p>
    </div>
    <div id="countdown-timer">
        <span data-i18n="illusion_redirect">REDIRECTING PROTOCOL...</span>
        <div id="progress-bar">
            <div id="progress-bar-inner"></div>
        </div>
    </div>
  </main>
  
  <audio id="ambient-audio" preload="auto" loop>
    <source src="assets/audio/omega2.m4a" type="audio/mp4" />
  </audio>
  
  <select id="lang-select" class="lang-select" aria-label="Select language">
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="uk">Українська</option>
    <option value="be">Беларуская</option>
    <option value="pl">Polski</option>
    <option value="de">Deutsch</option>
    <option value="fr">Français</option>
    <option value="es">Español</option>
  </select>
  
  <script type="module" src="js/doubleindex.js"></script>

</body>
</html>
