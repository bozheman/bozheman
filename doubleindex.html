<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOZHEMAN ≡ ИЛЛЮЗИЯ</title>
  <link rel="icon" type="image/png" href="gg.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }
    .terminal-window {
        width: 100%;
        max-width: 700px;
        padding: 2rem;
        border: 2px solid rgba(255, 51, 51, 0.3);
        background: rgba(10, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        text-align: center;
        z-index: 5;
        cursor: pointer;
        animation: flicker 5s linear infinite;
    }
    @keyframes flicker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.95; }
    }

    h1 {
        font-size: 2.5rem;
        margin-bottom: 1.5rem;
        text-shadow: 0 0 10px #ff00de;
    }

    #fragment-display {
        min-height: 80px;
        font-size: 1.5rem;
        padding: 1rem;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .glitch-text {
        position: relative;
        color: #fff;
        text-shadow: 
            0 0 5px #fff,
            0 0 10px #ff00de;
        animation: text-glitch 0.2s linear;
    }

    @keyframes text-glitch {
        0% { transform: skewX(5deg); opacity: 0.8; }
        50% { transform: skewX(-5deg); opacity: 1; }
        100% { transform: skewX(0); opacity: 1; }
    }

    #countdown-timer {
        margin-top: 1.5rem;
        font-size: 1rem;
        color: rgba(255, 51, 51, 0.7);
    }
    #progress-bar {
        width: 100%;
        height: 2px;
        background: rgba(255, 51, 51, 0.3);
        margin-top: 0.5rem;
    }
    #progress-bar-inner {
        width: 100%;
        height: 100%;
        background: #ff3333;
        transition: width 1s linear;
    }

  </style>
</head>
<body>

  <canvas id="matrix-canvas"></canvas>

  <main class="terminal-window" id="terminal">
    <h1 data-text="ИЛЛЮЗИЯ">ИЛЛЮЗИЯ</h1>
    <div id="fragment-display">
        <p>[КЛИКНИ, ЧТОБЫ УЗРЕТЬ]</p>
    </div>
    <div id="countdown-timer">
        <span>ПЕРЕАДРЕСАЦИЯ ПРОТОКОЛА...</span>
        <div id="progress-bar">
            <div id="progress-bar-inner"></div>
        </div>
    </div>
  </main>
  
  <audio id="ambient-audio" preload="auto" loop>
    <source src="omega.m4a" type="audio/mp4" />
  </audio>
  
  <script>
    // --- Матрица на фоне ---
    function setupMatrix() {
      const canvas = document.getElementById('matrix-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const chars = "BOZHEMAN01";
      const font_size = 14;
      const columns = canvas.width / font_size;
      const drops = Array.from({ length: columns }).fill(1);

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#600000';
        ctx.font = font_size + 'px Fira Code';
        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * font_size, drops[i] * font_size);
          if (drops[i] * font_size > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }
      setInterval(draw, 50);
      window.addEventListener('resize', () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
      });
    }
    setupMatrix();

    // --- Логика страницы ---
    const terminal = document.getElementById('terminal');
    const fragmentDisplay = document.getElementById('fragment-display');
    const progressBarInner = document.getElementById('progress-bar-inner');
    const ambientAudio = document.getElementById('ambient-audio');

    const fragments = [
        "Ты уже проиграл.",
        "Ты слеп.",
        "Узри.",
        "Скоро всё изменится.",
        "Ты нашёл глиф: /sigil",
        "Наблюдай...",
        "Здесь пусто, как в тебе.",
        "Реальность - это сбой.",
        "Протокол нестабилен.",
    ];
    let currentFragmentIndex = 0;

    // --- Воспроизведение звука ---
    // Начинаем с 7 секунды, как в оригинале
    function playAudio() {
        if (ambientAudio.readyState >= 2) {
            ambientAudio.currentTime = 7;
            ambientAudio.play().catch(e => console.log("Для воспроизведения звука требуется взаимодействие с пользователем."));
        } else {
            ambientAudio.addEventListener('canplaythrough', playAudio, { once: true });
        }
    }
    playAudio();


    // --- Отображение фрагментов по клику ---
    terminal.addEventListener('click', () => {
        // Запускаем звук по первому клику, если он не запустился автоматически
        if (ambientAudio.paused) {
            ambientAudio.play();
        }

        currentFragmentIndex = (currentFragmentIndex + 1) % fragments.length;
        const fragmentText = fragments[currentFragmentIndex];
        
        fragmentDisplay.innerHTML = `<p class="glitch-text">${fragmentText}</p>`;
    });

    // --- Таймер переадресации ---
    let countdown = 60;
    const timer = setInterval(() => {
        countdown--;
        const percentage = (countdown / 60) * 100;
        progressBarInner.style.width = `${percentage}%`;

        if (countdown <= 0) {
            clearInterval(timer);
            document.body.style.transition = 'opacity 1.5s ease';
            document.body.style.opacity = '0';
            setTimeout(() => {
                window.location.href = "roulet.html";
            }, 1500);
        }
    }, 1000);

  </script>

</body>
</html>
