<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOZHEMAN ≡ 777</title>
  <link rel="icon" type="image/png" href="assets/images/gg.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/roulet.css">
</head>
<body>

  <!-- Фоновая матрица -->
  <canvas id="matrix-canvas"></canvas>

  <div class="machine-wrapper">
    <h1 class="page-title" data-text="BOZHEMAN SLOTS">BOZHEMAN SLOTS</h1>

    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-label">БАЛАНС</span>
        <span class="stat-value" id="balance-display">1000</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">СПИНЫ</span>
        <span class="stat-value" id="spins-display">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">ПРОШЛАЯ СТАВКА</span>
        <span class="stat-value" id="last-bet-display">—</span>
      </div>
    </div>

    <div class="machine-cabinet">
      <div class="reels-section">
        <div class="win-line" id="win-line"></div>
        <div class="reel-wrap"><canvas id="reel-canvas-0"></canvas></div>
        <div class="reel-wrap"><canvas id="reel-canvas-1"></canvas></div>
        <div class="reel-wrap"><canvas id="reel-canvas-2"></canvas></div>
      </div>

      <div class="pay-table">
        <div class="pay-row"><span class="pay-symbol">7 7 7</span><span class="pay-mult">x50</span></div>
        <div class="pay-row"><span class="pay-symbol">★ ★ ★</span><span class="pay-mult">x20</span></div>
        <div class="pay-row"><span class="pay-symbol">Ω Ω Ω</span><span class="pay-mult">x10</span></div>
        <div class="pay-row"><span class="pay-symbol">▲ ▲ ▲</span><span class="pay-mult">x5</span></div>
        <div class="pay-row"><span class="pay-symbol">■ ■ ■</span><span class="pay-mult">x3</span></div>
        <div class="pay-row"><span class="pay-symbol">ЛЮБЫЕ 2</span><span class="pay-mult">x1</span></div>
      </div>

      <div class="controls-section">
        <div class="bet-row" style="display: flex; gap: 0.5rem; align-items: center;">
          <button class="chip" id="btn-bet-minus" style="flex: 0; min-width: 40px; font-size: 1.2rem;">-</button>
          <input type="number" id="bet-input" class="input-field" placeholder="СТАВКА" min="10" max="99999" value="10" />
          <button class="chip" id="btn-bet-plus" style="flex: 0; min-width: 40px; font-size: 1.2rem;">+</button>
        </div>
        
        <div class="chip-row">
          <button class="chip" data-amount="10">MIN</button>
          <button class="chip" data-amount="50">+50</button>
          <button class="chip" data-amount="100">+100</button>
          <button class="chip" data-amount="max">MAX</button>
        </div>

        <button id="btn-spin" class="btn-spin" data-text="КРУТИТЬ (SPACE)">КРУТИТЬ (SPACE)</button>
      </div>
    </div>

    <div class="history-section">
      <div class="history-title">ИСТОРИЯ ОПЕРАЦИЙ</div>
      <div id="history-list"></div>
    </div>

    <a href="games.html" class="back-link">< НАЗАД К ИГРАМ</a>
  </div>

  <canvas id="particle-canvas"></canvas>

  <div id="result-toast">
    <div id="toast-label">ВЫИГРЫШ</div>
    <div id="toast-amount">0</div>
    <div id="toast-desc"></div>
  </div>

  <div id="error-bar"></div>

  <audio id="sfx-ambient" src="assets/audio/glitch.mp3" loop preload="auto"></audio>

  <script type="module" src="js/roulette.js"></script>
</body>
</html>
