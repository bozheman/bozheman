<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOZHEMAN ≡ ROULETTE</title>
  <link rel="icon" type="image/png" href="gg.png" />
  <!-- Подключаем только шрифты, основной стиль больше не нужен -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* =============================================
       BOZHEMAN ≡ ROULETTE ‖ ADAPTIVE STYLES
       ============================================= */
    :root {
      --base-color: #ff3333;
      --bg-color: #000;
      --surface-color: rgba(10, 0, 0, 0.3);
      --border-color: rgba(255, 51, 51, 0.3);
      --green-color: #008000;
      --red-color: #8B0000;
      --black-color: #222;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--base-color);
      font-family: 'Fira Code', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    #matrix-canvas {
      position: fixed; top: 0; left: 0;
      z-index: -1; pointer-events: none;
    }

    .page-title {
        font-size: clamp(1.5rem, 5vw, 2rem);
        margin: 2rem 0;
        text-decoration: none;
        color: var(--base-color);
    }
    
    .roulette-container {
        width: 100%;
        max-width: 1200px;
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }
    
    .info-section {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        width: 100%;
        padding: 1rem;
        border: 2px solid var(--border-color);
        background: var(--surface-color);
        backdrop-filter: blur(5px);
        text-align: center;
    }
    .info-section h3 { font-size: 0.8rem; margin-bottom: 0.5rem; opacity: 0.7; }
    .info-section p { font-size: 1.2rem; font-weight: bold; }

    .game-layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
    }

    .wheel-section {
        position: relative;
        width: 100%;
        max-width: 380px;
        aspect-ratio: 1 / 1;
        margin: 0 auto;
    }
    #wheel-canvas { width: 100%; height: 100%; }
    .pointer {
        position: absolute; top: -5px; left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-top: 30px solid var(--base-color);
        filter: drop-shadow(0 0 5px var(--base-color));
    }

    .bet-board {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 4px;
    }
    .bet-cell {
        position: relative; aspect-ratio: 1 / 1;
        display: flex; justify-content: center; align-items: center;
        font-weight: bold; cursor: pointer;
        border: 1px solid var(--border-color);
        transition: background-color 0.2s;
        font-size: clamp(0.7rem, 2vw, 1rem);
    }
    .bet-cell:hover { background-color: rgba(255, 51, 51, 0.3); }
    .number-0 { grid-column: 1 / 13; background-color: var(--green-color); }
    .red { background-color: var(--red-color); }
    .black { background-color: var(--black-color); color: white; }
    .special { aspect-ratio: auto; padding: 0.5rem; }
    [data-bet-type="1-12"], [data-bet-type="13-24"], [data-bet-type="25-36"] { grid-column: span 4; }
    [data-bet-type="1-18"], [data-bet-type="19-36"] { grid-column: span 6; }
    [data-bet-type="even"], [data-bet-type="odd"] { grid-column: span 3; }
    [data-bet-type="red-bet"], [data-bet-type="black-bet"] { grid-column: span 3; }

    .chip-on-cell {
        position: absolute; width: 70%; height: 70%;
        border-radius: 50%; color: white;
        display: flex; justify-content: center; align-items: center;
        font-size: 0.8em; pointer-events: none;
        text-shadow: 1px 1px 2px black;
    }

    .controls-section {
        margin-top: 1rem; padding: 1rem;
        border: 2px solid var(--border-color);
        background: var(--surface-color);
        backdrop-filter: blur(5px);
        display: flex; flex-direction: column; gap: 1rem;
    }
    .chips-selector, .actions {
        display: flex; flex-wrap: wrap; justify-content: center;
        align-items: center; gap: 0.5rem;
    }
    .chip {
        width: 40px; height: 40px; border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        font-weight: bold; cursor: pointer; border: 2px solid;
        transition: transform 0.2s, box-shadow 0.2s;
    }
    .chip.active { transform: scale(1.1); box-shadow: 0 0 15px; }
    
    .btn-glitch { /* Стили из styles.css для кнопок */
        position: relative; display: block; padding: 1rem;
        text-align: center; text-decoration: none; color: var(--base-color);
        font-size: 1.1rem; border: 2px solid var(--border-color);
        background: rgba(10, 0, 0, 0.3); backdrop-filter: blur(5px);
        transition: all 0.3s ease; overflow: hidden;
    }

    /* Медиа-запрос для больших экранов */
    @media (min-width: 1024px) {
        .game-layout {
            grid-template-columns: 380px 1fr;
            align-items: flex-start;
        }
    }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <div class="roulette-container">
    <a href="index.html" class="page-title" data-text="BOZHEMAN ≡ ROULETTE">BOZHEMAN ≡ ROULETTE</a>

    <section class="info-section">
        <div><h3>БАЛАНС</h3><p id="balance-display">1000</p></div>
        <div><h3>СТАВКА</h3><p id="total-bet-display">0</p></div>
        <div><h3>ПОСЛЕДНЕЕ</h3><p id="last-number-display">-</p></div>
    </section>

    <div class="game-layout">
        <div class="wheel-section">
            <div class="pointer"></div>
            <canvas id="wheel-canvas" width="380" height="380"></canvas>
        </div>
        
        <div class="betting-section">
            <div class="bet-board" id="bet-board"></div>
            <div class="controls-section">
                <div class="chips-selector" id="chips-selector"></div>
                <div class="actions">
                    <button class="btn-glitch" id="spin-button" data-text="КРУТИТЬ">КРУТИТЬ</button>
                    <button class="btn-glitch" id="clear-button" data-text="ОЧИСТИТЬ">ОЧИСТИТЬ</button>
                </div>
            </div>
        </div>
    </div>
  </div>

  <!-- Модальное окно (остается без изменений) -->
  <div class="modal-overlay" id="sigil-modal-overlay"> ... </div>

  <script src="roulette.js"></script>
  <script>
    // Скрипт для фона "Матрица"
    function setupMatrix() { /* ... */ }
    setupMatrix();
  </script>
</body>
</html>
