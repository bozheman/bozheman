<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOZHEMAN ≡ 777</title>
  <link rel="icon" type="image/png" href="gg.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --base-color: #ff3333;
      --bg-color: #000;
      --surface-color: rgba(10, 0, 0, 0.3);
      --border-color: rgba(255, 51, 51, 0.3);
      --success-color: #00ff88;
      --glow-color: #ff00de;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: var(--bg-color);
      color: var(--base-color);
      font-family: 'Fira Code', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }
    #matrix-canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }

    .slot-machine {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      border: 2px solid var(--border-color);
      background: var(--surface-color);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-align: center;
    }

    .page-title {
        font-size: 2rem;
        margin-bottom: 2rem;
        text-shadow: 0 0 5px var(--base-color), 0 0 10px var(--glow-color);
    }
    
    .info-display {
        margin-bottom: 2rem;
    }
    .info-display h3 { font-size: 1rem; opacity: 0.7; }
    .info-display p { font-size: 2rem; font-weight: bold; color: #fff; }

    .reel-container {
        height: 150px;
        width: 150px;
        margin: 0 auto 2rem auto;
        border: 2px solid var(--border-color);
        overflow: hidden;
        position: relative;
        background: rgba(0,0,0,0.5);
    }
    #reel {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        transition: top 1s cubic-bezier(0.7, 0, 0.3, 1);
    }
    .reel-number {
        height: 150px;
        font-size: 100px;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        text-shadow: 0 0 10px var(--base-color);
    }
    
    .controls { display: flex; flex-direction: column; gap: 1.5rem; }
    .input-group { display: flex; gap: 1rem; }
    .input-field {
        background: transparent;
        border: 1px solid var(--border-color);
        color: #fff;
        font-family: 'Fira Code', monospace;
        font-size: 1.2rem;
        text-align: center;
        padding: 0.8rem;
        width: 100%;
    }
    .input-field::placeholder { color: rgba(255,255,255,0.3); }
    .input-field:focus { outline: none; border-color: var(--base-color); }
    
    .btn-glitch { /* Стили из styles.css для кнопок */
        position: relative; display: block; padding: 1rem;
        text-align: center; text-decoration: none; color: var(--base-color);
        font-size: 1.1rem; border: 2px solid var(--border-color);
        background: rgba(10, 0, 0, 0.3); backdrop-filter: blur(5px);
        transition: all 0.3s ease; overflow: hidden;
        cursor: pointer;
    }
    .btn-glitch:disabled { cursor: not-allowed; opacity: 0.5; }

    .rules { margin-top: 2rem; opacity: 0.6; }
    
    /* Модальное окно для сообщений */
    .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.8);
        z-index: 1000; display: flex;
        justify-content: center; align-items: center;
        opacity: 0; pointer-events: none;
        transition: opacity 0.3s ease;
    }
    .modal-overlay.visible { opacity: 1; pointer-events: all; }
    .message-modal {
        background: #111; padding: 2rem;
        border: 2px solid var(--base-color);
        text-align: center; max-width: 300px;
    }
    .message-modal p { font-size: 1.2rem; line-height: 1.6; color: #fff; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <canvas id="matrix-canvas"></canvas>

  <div class="slot-machine">
    <h1 class="page-title" data-text="BOZHEMAN ≡ 777">BOZHEMAN ≡ 777</h1>

    <div class="info-display">
        <h3>БАЛАНС</h3>
        <p id="balance-display">1000</p>
    </div>

    <div class="reel-container">
        <div id="reel">
            <div class="reel-number">7</div>
        </div>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="number" id="guess-input" class="input-field" placeholder="ЧИСЛО (1-7)">
            <input type="number" id="bet-input" class="input-field" placeholder="СТАВКА">
        </div>
        <button class="btn-glitch" id="spin-button" data-text="КРУТИТЬ">КРУТИТЬ</button>
    </div>

    <p class="rules">Угадай одно из семи чисел и получи x2</p>
  </div>

  <div class="modal-overlay" id="message-modal-overlay">
      <div class="message-modal">
          <p id="modal-text"></p>
          <button class="btn-glitch" id="modal-close-button" data-text="OK">OK</button>
      </div>
  </div>

  <script src="roulette.js"></script>
  <script>
    function setupMatrix() {
        const canvas = document.getElementById('matrix-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = "BOZHEMAN01";
        const font_size = 14;
        const columns = canvas.width / font_size;
        const drops = Array.from({ length: columns }).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#600000';
            ctx.font = font_size + 'px Fira Code';
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * font_size, drops[i] * font_size);
                if (drops[i] * font_size > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(draw, 50);
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    }
    setupMatrix();
  </script>
</body>
</html>
