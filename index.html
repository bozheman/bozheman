<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOZHEMAN ≡ PROTOCOL</title>
  <link rel="icon" type="image/png" href="gg.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ЭКРАН ЗАГРУЗКИ -->
  <div id="preloader">
    <div id="preloader-text"></div>
  </div>

  <!-- ФОНОВАЯ АНИМАЦИЯ (МАТРИЦА) -->
  <canvas id="matrix-canvas"></canvas>
  
  <!-- 3D СЦЕНА -->
  <div id="scene-container">
    <canvas id="scene-canvas"></canvas>
  </div>

  <!-- ИНТЕРФЕЙС -->
  <header id="ui-header">
    <div id="brand-title">BOZHEMAN</div>
    <!-- ОБНОВЛЕННАЯ КНОПКА ЗВУКА С SVG -->
    <button id="sound-toggle" aria-label="Переключить звук">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="sound-icon">
        <path class="sound-on-icon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        <path class="sound-off-icon" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>
  </header>
  
  <!-- КНОПКИ (ИНТЕРФЕЙС ЧЕЛОВЕКА) -->
  <nav id="links-container"></nav>

  <!-- АУДИО -->
  <audio id="ambient-audio" loop preload="auto">
    <source src="omega.m4a" type="audio/mp4" />
  </audio>
   <audio id="glitch-audio" preload="auto">
    <source src="glitch.mp3" type="audio/mpeg" />
  </audio>

  <!-- СКРИПТЫ -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    // Импорт необходимых библиотек
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import TWEEN from 'three/addons/libs/tween.module.js';

    // --- НАСТРОЙКИ ---
    const PRELOADER_LINES = [
      { text: '> INIT_CONNECTION...', delay: 1500 },
      { text: '> AUTH_USER_IDENTITY... [ACCEPTED]', delay: 1000 },
      { text: '> LOADING_PROTOCOL_0ZERO...', delay: 1500 },
      { text: '> ACCESS GRANTED', delay: 800 }
    ];

    const LINKS = [
      { name: 'Telegram', url: 'https://t.me/bozheman' },
      { name: 'Нулевой протокол', url: 'https://t.me/protocol_0zero' },
      { name: 'Відповідальна Нація', url: 'https://t.me/vidpovnac' },
      { name: 'YouTube', url: 'https://www.youtube.com/channel/UC_BgtvZc1dxQbJA1uEeFimw' },
      { name: 'TikTok', url: 'https://www.tiktok.com/@bozheman_' },
      { name: 'Instagram', url: 'https://www.instagram.com/bozheman' },
      { name: 'Discord', url: 'https://discord.gg/jNFZTsBz8j' },
      { name: '💰 DONATION', url: 'refer.html', isSpecial: true }
    ];
    
    const SECRET_CLICK_COUNT = 6;
    const SECRET_LINK_URL = 'doubleindex.html';

    // --- ИНИЦИАЛИЗАЦИЯ ---
    const preloader = document.getElementById('preloader');
    const preloaderText = document.getElementById('preloader-text');
    const matrixCanvas = document.getElementById('matrix-canvas');
    const sceneContainer = document.getElementById('scene-container');
    const sceneCanvas = document.getElementById('scene-canvas');
    const soundToggle = document.getElementById('sound-toggle');
    const ambientAudio = document.getElementById('ambient-audio');
    const glitchAudio = document.getElementById('glitch-audio');
    const linksContainer = document.getElementById('links-container');

    let scene, camera, renderer, controls;
    let mainObject;
    let secretClickCounter = 0;

    init();
    runPreloader();

    // --- ОСНОВНЫЕ ФУНКЦИИ ---
    
    async function runPreloader() {
      for (const line of PRELOADER_LINES) {
        await typeLine(line.text, 50);
        await new Promise(resolve => setTimeout(resolve, line.delay));
      }
      preloader.classList.add('hidden');
      setTimeout(() => preloader.style.display = 'none', 1000);
    }

    function typeLine(text, speed) {
      return new Promise(resolve => {
        let i = 0;
        preloaderText.innerHTML = '';
        const typing = setInterval(() => {
          if (i < text.length) {
            preloaderText.innerHTML += text.charAt(i);
            i++;
          } else {
            clearInterval(typing);
            resolve();
          }
        }, speed);
      });
    }

    function setupMatrix() {
      const ctx = matrixCanvas.getContext('2d');
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
      const chars = "BOZHEMAN01";
      const font_size = 14;
      const columns = matrixCanvas.width / font_size;
      const drops = Array.from({ length: columns }).fill(1);

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
        ctx.fillStyle = '#600000';
        ctx.font = font_size + 'px Fira Code';
        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * font_size, drops[i] * font_size);
          if (drops[i] * font_size > matrixCanvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }
      // ИЗМЕНЕНА СКОРОСТЬ: было 33, стало 50
      setInterval(draw, 50);
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, sceneContainer.clientWidth / sceneContainer.clientHeight, 0.1, 1000);
      camera.position.z = 3.5;
      
      renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, antialias: true, alpha: true });
      renderer.setSize(sceneContainer.clientWidth, sceneContainer.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);
      const pointLight = new THREE.PointLight(0xff0000, 150, 100);
      scene.add(pointLight);
      
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;
      
      createMainObject();
      createLinkButtons();
      setupMatrix();
      animate();
      
      window.addEventListener('resize', onWindowResize);
      sceneCanvas.addEventListener('click', onCanvasClick);
      soundToggle.addEventListener('click', toggleSound);
    }

    function createMainObject() {
      const geometry = new THREE.IcosahedronGeometry(1.2, 1);
      const material = new THREE.MeshStandardMaterial({
        color: 0xcc0000,
        emissive: 0xcc0000,
        emissiveIntensity: 0.6,
        metalness: 0.8,
        roughness: 0.2,
        wireframe: true
      });
      mainObject = new THREE.Mesh(geometry, material);
      scene.add(mainObject);
    }

    function createLinkButtons() {
        linksContainer.innerHTML = '';
        LINKS.forEach(link => {
            const a = document.createElement('a');
            a.href = link.url;
            a.className = 'btn-glitch';
            a.textContent = link.name;
            a.setAttribute('data-text', link.name);
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            if(link.isSpecial) {
                a.classList.add('special');
            }
            linksContainer.appendChild(a);
        });
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      TWEEN.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = sceneContainer.clientWidth / sceneContainer.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(sceneContainer.clientWidth, sceneContainer.clientHeight);
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
    }

    function onCanvasClick() {
        secretClickCounter++;
        
        const originalIntensity = mainObject.material.emissiveIntensity;
        new TWEEN.Tween({ intensity: originalIntensity })
            .to({ intensity: 2.0 }, 100)
            .easing(TWEEN.Easing.Quadratic.Out)
            .yoyo(true)
            .repeat(1)
            .onUpdate((obj) => { mainObject.material.emissiveIntensity = obj.intensity; })
            .start();

        if (secretClickCounter >= SECRET_CLICK_COUNT) {
            activateSecretProtocol();
        }
    }

    function activateSecretProtocol() {
        console.log("SECRET PROTOCOL ACTIVATED!");
        if(!glitchAudio.paused) {
            glitchAudio.currentTime = 0;
        } else {
            glitchAudio.play();
        }
        document.body.classList.add('glitch-out');
        setTimeout(() => {
            window.location.href = SECRET_LINK_URL;
        }, 1500);
    }
    
    function toggleSound() {
        if (ambientAudio.paused) {
            ambientAudio.play().catch(e => console.error("Audio play failed:", e));
            soundToggle.classList.remove('muted');
        } else {
            ambientAudio.pause();
            soundToggle.classList.add('muted');
        }
    }
  </script>
</body>
</html>
