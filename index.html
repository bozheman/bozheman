<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOZHEMAN ≡ PROTOCOL</title>
  <link rel="icon" type="image/png" href="gg.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ЭКРАН ЗАГРУЗКИ -->
  <div id="preloader">
    <div id="preloader-text"></div>
  </div>

  <!-- ФОНОВАЯ АНИМАЦИЯ (МАТРИЦА) -->
  <canvas id="matrix-canvas"></canvas>
  
  <!-- 3D СЦЕНА -->
  <canvas id="scene-canvas"></canvas>

  <!-- ИНТЕРФЕЙС -->
  <div id="ui-container">
    <div id="brand-title">BOZHEMAN</div>
    <button id="sound-toggle" aria-label="Переключить звук">🔇</button>
  </div>
  <div id="link-label"></div>

  <!-- АУДИО -->
  <audio id="ambient-audio" loop preload="auto">
    <source src="omega.m4a" type="audio/mp4" />
  </audio>

  <!-- СКРИПТЫ -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    // Импорт необходимых библиотек
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TWEEN } from 'three/addons/libs/tween.module.min.js';

    // --- НАСТРОЙКИ ---
    const PRELOADER_LINES = [
      { text: '> INIT_CONNECTION...', delay: 1500 },
      { text: '> AUTH_USER_IDENTITY... [ACCEPTED]', delay: 1000 },
      { text: '> LOADING_PROTOCOL_0ZERO...', delay: 1500 },
      { text: '> ACCESS GRANTED', delay: 800 }
    ];

    const LINKS = [
      { name: 'Telegram', url: 'https://t.me/bozheman', position: new THREE.Vector3(0, 1.8, 0) },
      { name: 'Нулевой протокол', url: 'https://t.me/protocol_0zero', position: new THREE.Vector3(1.8, 0.5, 0) },
      { name: 'Відповідальна Нація', url: 'https://t.me/vidpovnac', position: new THREE.Vector3(1.8, -0.5, 0) },
      { name: 'YouTube', url: 'https://www.youtube.com/channel/UC_BgtvZc1dxQbJA1uEeFimw', position: new THREE.Vector3(0, -1.8, 0) },
      { name: 'TikTok', url: 'https://www.tiktok.com/@bozheman_', position: new THREE.Vector3(-1.8, -0.5, 0) },
      { name: 'Instagram', url: 'https://www.instagram.com/bozheman', position: new THREE.Vector3(-1.8, 0.5, 0) },
      { name: 'Discord', url: 'https://discord.gg/jNFZTsBz8j', position: new THREE.Vector3(0, 0, 1.8) },
      { name: '💰 DONATION', url: 'refer.html', position: new THREE.Vector3(0, 0, -1.8) }
    ];
    
    const SECRET_CLICK_COUNT = 5;
    const SECRET_LINK_URL = 'doubleindex.html';
    const SECRET_LINK_NAME = 'PROTOCOL_NULL';

    // --- ИНИЦИАЛИЗАЦИЯ ---
    const preloader = document.getElementById('preloader');
    const preloaderText = document.getElementById('preloader-text');
    const matrixCanvas = document.getElementById('matrix-canvas');
    const sceneCanvas = document.getElementById('scene-canvas');
    const soundToggle = document.getElementById('sound-toggle');
    const ambientAudio = document.getElementById('ambient-audio');
    const linkLabel = document.getElementById('link-label');

    let scene, camera, renderer, controls, raycaster;
    let mainObject, hotspotsGroup, secretHotspotMesh;
    const mouse = new THREE.Vector2();
    let activeLink = null;
    let clickTracker = { hotspot: null, count: 0, timer: null };

    init();
    runPreloader();

    // --- ОСНОВНЫЕ ФУНКЦИИ ---
    
    // 1. Анимация прелоадера
    async function runPreloader() {
      for (const line of PRELOADER_LINES) {
        await typeLine(line.text, 50);
        await new Promise(resolve => setTimeout(resolve, line.delay));
      }
      preloader.classList.add('hidden');
      setTimeout(() => preloader.style.display = 'none', 1000);
    }

    function typeLine(text, speed) {
      return new Promise(resolve => {
        let i = 0;
        preloaderText.innerHTML = '';
        const typing = setInterval(() => {
          if (i < text.length) {
            preloaderText.innerHTML += text.charAt(i);
            i++;
          } else {
            clearInterval(typing);
            resolve();
          }
        }, speed);
      });
    }

    // 2. Анимация фона "Матрица"
    function setupMatrix() {
      const ctx = matrixCanvas.getContext('2d');
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
      const chars = "BOZHEMAN01";
      const font_size = 14;
      const columns = matrixCanvas.width / font_size;
      const drops = Array.from({ length: columns }).fill(1);

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
        ctx.fillStyle = '#600000';
        ctx.font = font_size + 'px Fira Code';

        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * font_size, drops[i] * font_size);
          if (drops[i] * font_size > matrixCanvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }
      setInterval(draw, 33);
    }

    // 3. Настройка 3D-сцены
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;
      renderer = new THREE.WebGLRenderer({ canvas: sceneCanvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);
      const pointLight = new THREE.PointLight(0xff0000, 100, 100);
      pointLight.position.set(5, 5, 5);
      scene.add(pointLight);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enableZoom = false;
      controls.enablePan = false;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.5;
      raycaster = new THREE.Raycaster();
      createMainObject();
      createHotspots();
      createSecretHotspot();
      setupMatrix();
      animate();
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('click', onClick);
      soundToggle.addEventListener('click', toggleSound);
    }

    // 4. Создание 3D-объектов
    function createMainObject() {
      const geometry = new THREE.IcosahedronGeometry(1, 0);
      const material = new THREE.MeshStandardMaterial({
        color: 0xcc0000,
        emissive: 0xcc0000,
        emissiveIntensity: 0.5,
        metalness: 0.8,
        roughness: 0.2,
        wireframe: true
      });
      mainObject = new THREE.Mesh(geometry, material);
      scene.add(mainObject);
    }

    function createHotspots() {
      hotspotsGroup = new THREE.Group();
      LINKS.forEach(link => {
        const geometry = new THREE.SphereGeometry(0.2, 16, 16);
        const material = new THREE.MeshBasicMaterial({ visible: false });
        const hotspot = new THREE.Mesh(geometry, material);
        hotspot.position.copy(link.position);
        hotspot.userData = { url: link.url, name: link.name };
        hotspotsGroup.add(hotspot);
      });
      scene.add(hotspotsGroup);
    }
    
    function createSecretHotspot() {
        const geometry = new THREE.SphereGeometry(0.2, 16, 16);
        const material = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0, visible: false });
        secretHotspotMesh = new THREE.Mesh(geometry, material);
        secretHotspotMesh.position.set(0, 0, 0);
        secretHotspotMesh.userData = { url: SECRET_LINK_URL, name: SECRET_LINK_NAME, isSecret: true };
        hotspotsGroup.add(secretHotspotMesh);
    }

    // 5. Цикл анимации
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(hotspotsGroup.children);

      if (intersects.length > 0) {
        const intersectedObject = intersects[0].object;
        activeLink = intersectedObject.userData;
        document.body.style.cursor = 'pointer';
        linkLabel.style.display = 'block';
        linkLabel.textContent = activeLink.name;
        if (!activeLink.isSecret) {
          mainObject.material.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.005) * 0.2;
        }
      } else {
        activeLink = null;
        document.body.style.cursor = 'default';
        linkLabel.style.display = 'none';
        mainObject.material.emissiveIntensity = 0.5;
      }

      const rotationSpeed = 0.001;
      mainObject.rotation.y += rotationSpeed;
      hotspotsGroup.rotation.y += rotationSpeed;
      
      TWEEN.update();
      renderer.render(scene, camera);
    }

    // 6. Обработчики событий
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      matrixCanvas.width = window.innerWidth;
      matrixCanvas.height = window.innerHeight;
    }

    function onMouseMove(event) {
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      linkLabel.style.left = (event.clientX + 15) + 'px';
      linkLabel.style.top = (event.clientY + 15) + 'px';
    }

    function onClick() {
      if (activeLink) {
        if (!activeLink.isSecret) {
          if (clickTracker.hotspot === activeLink.url) {
            clickTracker.count++;
          } else {
            clickTracker.hotspot = activeLink.url;
            clickTracker.count = 1;
          }

          clearTimeout(clickTracker.timer);
          clickTracker.timer = setTimeout(() => {
            clickTracker.count = 0;
            clickTracker.hotspot = null;
          }, 1500);

          if (clickTracker.count >= SECRET_CLICK_COUNT) {
            activateSecretProtocol();
            clickTracker.count = 0;
            clickTracker.hotspot = null;
            clearTimeout(clickTracker.timer);
            return;
          }
          
          window.open(activeLink.url, '_blank');
        } else {
          window.open(activeLink.url, '_blank');
        }
      }
    }
    
    function activateSecretProtocol() {
      console.log("SECRET PROTOCOL ACTIVATED!");
      secretHotspotMesh.material.visible = true;
      new TWEEN.Tween(secretHotspotMesh.material).to({ opacity: 0.8 }, 1000).start();
      
      const originalEmissive = mainObject.material.emissiveIntensity;
      const tween = new TWEEN.Tween({ intensity: originalEmissive })
        .to({ intensity: 2.0 }, 200)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onUpdate((obj) => {
          mainObject.material.emissiveIntensity = obj.intensity;
        });

      const tweenBack = new TWEEN.Tween({ intensity: 2.0 })
        .to({ intensity: originalEmissive }, 800)
        .easing(TWEEN.Easing.Quadratic.In)
        .onUpdate((obj) => {
          mainObject.material.emissiveIntensity = obj.intensity;
        });

      tween.chain(tweenBack).start();
    }
    
    function toggleSound() {
        if (ambientAudio.paused) {
            ambientAudio.play().catch(e => console.error("Audio play failed:", e));
            soundToggle.textContent = '🔊';
        } else {
            ambientAudio.pause();
            soundToggle.textContent = '🔇';
        }
    }
  </script>
</body>
</html>
