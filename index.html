  <style>
    html, body {

    #bzp-boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 42%, rgba(255, 42, 59, 0.12), #040406 60%);
      z-index: 9999;
      transition: opacity 0.35s ease;
    }

    .bzp-ring {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.08);
      border-top-color: #ff2a3b;
      animation: bzp-spin 0.85s linear infinite;
    }

    .bzp-wordmark {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.28em;
      color: rgba(248, 250, 252, 0.85);
    }

    @keyframes bzp-spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script type="application/ld+json">

<body>
  <div id="bzp-boot">
    <div class="bzp-ring"></div>
    <div class="bzp-wordmark">BOZHEMAN</div>
  </div>

  <script>
    (function () {
      // Proactively unregister legacy service workers so new GitHub deploys appear immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        }).catch(function () {});
      }

      let audioCtx = null;
      let masterBus = null;

      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
          const comp = audioCtx.createDynamicsCompressor();
          masterBus = audioCtx.createGain();
          masterBus.gain.setValueAtTime(0.75, audioCtx.currentTime);
          masterBus.connect(comp);
          comp.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(function () {});
        }
        return audioCtx;
      }

      window.bzpBridge = {
        storageGet: function (key) {
          try {
            return window.localStorage.getItem(key) || '';
          } catch (_) {
            return '';
          }
        },
        storageSet: function (key, val) {
          try {
            window.localStorage.setItem(key, val);
          } catch (_) {}
        },
        openUrl: function (url) {
          try {
            window.open(url, '_blank', 'noopener,noreferrer');
          } catch (_) {}
        },
        copyText: function (text) {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).catch(function () {});
            }
          } catch (_) {}
        },
        setCrt: function (_) {
          // Intentionally kept as a no-op in V2 for crystal clear typography
        },
        playTone: function (freq, type, dur, gainVal, delaySec, freqEnd) {
          try {
            const ac = ensureAudio();
            if (!ac || !masterBus) return;
            const start = ac.currentTime + (delaySec || 0);
            const stop = start + (dur || 0.05);
            const osc = ac.createOscillator();
            const g = ac.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, start);
            if (freqEnd && freqEnd > 20) {
              osc.frequency.exponentialRampToValueAtTime(freqEnd, stop);
            }
            g.gain.setValueAtTime(Math.max(0.0001, gainVal || 0.1), start);
            g.gain.exponentialRampToValueAtTime(0.0001, stop);
            osc.connect(g);
            g.connect(masterBus);
            osc.start(start);
            osc.stop(stop + 0.02);
          } catch (_) {}
        },
        fetchJson: function (url, method, body) {
          return fetch(url, {
            method: method || 'GET',
            headers: body ? { 'Content-Type': 'application/json' } : {},
            body: body || undefined
          }).then(function (resp) {
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            return resp.text();
          });
        }
      };

      window.addEventListener('flutter-first-frame', function () {
        const boot = document.getElementById('bzp-boot');
        if (boot) {
          boot.style.opacity = '0';
          setTimeout(function () { boot.remove(); }, 350);
        }
      });
    })();
  </script>
